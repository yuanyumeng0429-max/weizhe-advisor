<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影子董事 · 线索后台</title>
<style>
  body { margin:0; background:#14110e; color:#e8e2d6; font-family:system-ui,-apple-system,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:22px; color:#c9aa66; margin:0 0 24px; }
  .login { display:flex; gap:12px; max-width:480px; }
  input { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(180,150,100,0.3); border-radius:6px; padding:12px 16px; color:#e8e2d6; font-size:15px; outline:none; }
  button { background:#c9aa66; color:#1a1714; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#d8bb78; }
  .tip { color:#d98a6a; font-size:13px; margin-top:10px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:24px 0 16px; }
  .count { color:#8a8068; font-size:14px; }
  .card { border:1px solid rgba(180,150,100,0.25); border-radius:8px; padding:18px 20px; margin-bottom:14px; background:rgba(255,255,255,0.02); }
  .card .head { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; cursor:pointer; }
  .badge { font-size:12px; padding:3px 10px; border-radius:20px; border:1px solid rgba(201,170,102,0.5); color:#c9aa66; }
  .badge.lead { border-color:rgba(122,138,154,0.5); color:#7a8a9a; }
  .co { font-weight:600; font-size:16px; }
  .ph { color:#c9aa66; font-size:15px; letter-spacing:1px; }
  .tm { color:#8a8068; font-size:13px; margin-left:auto; }
  .qa { display:none; margin-top:14px; border-top:1px solid rgba(180,150,100,0.15); padding-top:14px; }
  .qa.open { display:block; }
  .q { color:#c9aa66; font-size:14px; margin:10px 0 4px; }
  .a { color:#cfc8b8; font-size:14px; line-height:1.8; white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>影子董事 · 线索后台</h1>

  <div id="loginBox">
    <div class="login">
      <input id="pwd" type="password" placeholder="输入管理密码" onkeydown="if(event.key==='Enter')load()">
      <button onclick="load()">查看记录</button>
    </div>
    <div class="tip hidden" id="loginTip"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button onclick="exportCSV()">导出 CSV</button>
    </div>
    <div id="listBox"></div>
  </div>
</div>

<script>
let DATA = [];

async function load(){
  const pwd = document.getElementById('pwd').value.trim();
  const tip = document.getElementById('loginTip');
  if(!pwd){ tip.textContent='请输入密码。'; tip.classList.remove('hidden'); return; }
  tip.classList.add('hidden');
  try {
    const resp = await fetch('/api/records?key=' + encodeURIComponent(pwd));
    if(resp.status === 401){ tip.textContent='密码不对。'; tip.classList.remove('hidden'); return; }
    if(!resp.ok){ tip.textContent='加载失败（状态 '+resp.status+'），稍后重试。'; tip.classList.remove('hidden'); return; }
    const data = await resp.json();
    DATA = data.records || [];
    render();
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
  } catch(e){
    tip.textContent = '连接出错：' + String(e);
    tip.classList.remove('hidden');
  }
}

function render(){
  document.getElementById('count').textContent = '共 ' + DATA.length + ' 条记录（新→旧）';
  const box = document.getElementById('listBox');
  box.innerHTML = '';
  DATA.forEach(function(r, idx){
    const card = document.createElement('div');
    card.className = 'card';
    const isLead = !r.qa || r.qa.length === 0;
    let qaHtml = '';
    (r.qa || []).forEach(function(item, i){
      qaHtml += '<div class="q">问' + (i+1) + '：' + esc(item.q||'') + '</div>'
              + '<div class="a">' + esc(item.a||'') + '</div>';
    });
    card.innerHTML =
      '<div class="head" onclick="toggle(' + idx + ')">'
      + '<span class="badge ' + (isLead?'lead':'') + '">' + (isLead?'新线索':'完整咨询') + '</span>'
      + '<span class="co">' + esc(r.company||'') + '</span>'
      + '<span class="ph">' + esc(r.phone||'') + '</span>'
      + '<span class="tm">' + esc((r.time||'').replace('T',' ').slice(0,19)) + '</span>'
      + '</div>'
      + '<div class="qa" id="qa' + idx + '">' + (qaHtml || '<div class="a">（用户填写了信息但尚未完成三轮提问）</div>') + '</div>';
    box.appendChild(card);
  });
}

function toggle(i){ document.getElementById('qa'+i).classList.toggle('open'); }

function exportCSV(){
  let rows = [['时间','类型','公司','手机号','问1','答1','问2','答2','问3','答3']];
  DATA.forEach(function(r){
    const row = [r.time||'', (!r.qa||r.qa.length===0)?'新线索':'完整咨询', r.company||'', r.phone||''];
    for(let i=0;i<3;i++){
      const item = (r.qa||[])[i] || {};
      row.push(item.q||'', item.a||'');
    }
    rows.push(row);
  });
  const csv = rows.map(function(row){
    return row.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '影子董事线索_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
