<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咨询记录管理 · 卫哲分身</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background:#0f0e0c;
    background-image: radial-gradient(circle at 20% 10%, rgba(180,140,80,0.08), transparent 40%);
    font-family:system-ui,-apple-system,sans-serif; color:#e8e2d6; padding:40px 24px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { font-size:24px; margin-bottom:6px; letter-spacing:1px; }
  .sub { color:#a89878; font-size:13px; margin-bottom:28px; }
  .gold { color:#c9aa66; }
  .login { max-width:420px; }
  input { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(180,150,100,0.3); border-radius:6px; padding:13px 16px; color:#e8e2d6; font-size:15px; outline:none; margin-bottom:12px; }
  input::placeholder { color:#6e6450; }
  .btn { background:linear-gradient(135deg,#c9aa66,#9c7b3e); border:none; border-radius:6px; padding:12px 24px; color:#1a1812; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn-ghost { background:transparent; border:1px solid rgba(180,150,100,0.4); color:#c9aa66; }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .err { color:#d98a6a; font-size:13px; margin-top:8px; }
  .count { color:#a89878; font-size:13px; }
  .rec { border:1px solid rgba(180,150,100,0.2); border-radius:10px; padding:18px 20px; margin-bottom:14px; background:rgba(255,255,255,0.02); }
  .rec .head { display:flex; justify-content:space-between; margin-bottom:12px; align-items:baseline; flex-wrap:wrap; gap:6px; }
  .rec .co { font-size:17px; font-weight:600; color:#c9aa66; }
  .rec .t { font-size:12px; color:#8a8068; }
  .qa { margin-top:10px; padding-top:10px; border-top:1px dashed rgba(180,150,100,0.15); }
  .qa .q { font-size:14px; color:#cdd5dd; margin-bottom:4px; }
  .qa .q b { color:#7a8a9a; }
  .qa .a { font-size:14px; color:#e8e2d6; line-height:1.7; white-space:pre-wrap; margin-bottom:6px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>咨询记录管理</h1>
  <div class="sub">卫哲分身 · <span class="gold">仅管理员可见</span></div>

  <div class="login" id="login">
    <input type="password" id="pwd" placeholder="输入管理员密码" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">进入</button>
    <div class="err hidden" id="loginErr"></div>
  </div>

  <div class="hidden" id="panel">
    <div class="bar">
      <span class="count" id="count"></span>
      <button class="btn" onclick="exportCSV()">导出为 CSV（Excel可打开）</button>
      <button class="btn btn-ghost" onclick="reload()">刷新</button>
      <button class="btn btn-ghost" onclick="logout()">退出</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
let PWD = "";
let RECORDS = [];

async function login(){
  const p = document.getElementById('pwd').value.trim();
  if(!p) return;
  const errEl = document.getElementById('loginErr');
  errEl.classList.add('hidden');
  try {
    const resp = await fetch("/.netlify/functions/records", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password: p })
    });
    const data = await resp.json();
    if(!resp.ok){ errEl.textContent = data.error || "密码错误"; errEl.classList.remove('hidden'); return; }
    PWD = p;
    RECORDS = data.records || [];
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    render();
  } catch(e){
    errEl.textContent = "出错了："+String(e); errEl.classList.remove('hidden');
  }
}

async function reload(){
  const resp = await fetch("/.netlify/functions/records", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ password: PWD })
  });
  const data = await resp.json();
  RECORDS = data.records || [];
  render();
}

function logout(){
  PWD = ""; RECORDS = [];
  document.getElementById('pwd').value = "";
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function fmtTime(iso){
  try { const d = new Date(iso); return d.toLocaleString('zh-CN'); } catch(e){ return iso; }
}

function render(){
  document.getElementById('count').textContent = "共 " + RECORDS.length + " 条咨询记录";
  const list = document.getElementById('list');
  if(RECORDS.length === 0){ list.innerHTML = '<div class="sub">暂无记录。</div>'; return; }
  list.innerHTML = RECORDS.map(r => {
    const qa = (r.qa||[]).map((item,i) =>
      '<div class="qa"><div class="q"><b>问题'+(i+1)+'：</b>'+esc(item.q)+'</div><div class="a">'+esc(item.a)+'</div></div>'
    ).join('');
    return '<div class="rec"><div class="head"><span class="co">'+esc(r.company)+'</span><span class="t">'+fmtTime(r.time)+'</span></div>'+qa+'</div>';
  }).join('');
}

function exportCSV(){
  let rows = [["时间","公司名称","问题序号","提问","卫哲回答"]];
  RECORDS.forEach(r => {
    (r.qa||[]).forEach((item,i) => {
      rows.push([fmtTime(r.time), r.company, "问题"+(i+1), item.q||"", item.a||""]);
    });
  });
  const csv = rows.map(row => row.map(cell => '"'+String(cell).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "卫哲咨询记录_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

function esc(s){ return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
